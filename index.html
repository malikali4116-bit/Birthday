<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Gowsi Papa 💚</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Dancing+Script:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--em:#0b3d2e;--deep:#06241b;--sage:#9caf88;--mint:#c8f0d8;--cream:#fbf6e9;--glow:#3dffa0;--ink:#16372b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--deep);color:var(--cream);font-family:'Poppins',system-ui,sans-serif;font-weight:300;overflow-x:hidden}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:600}
section{min-height:100vh;padding:80px 20px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pale{background:linear-gradient(160deg,var(--mint),var(--cream));color:var(--ink)}
.dark{background:radial-gradient(ellipse at top,#0f5a43 0%,var(--deep) 70%)}
h2{font-size:clamp(1.8rem,6vw,3rem);margin-bottom:8px}
.sub{opacity:.8;margin-bottom:36px;font-style:italic}
.glow{text-shadow:0 0 18px var(--glow),0 0 40px rgba(61,255,160,.5)}
.reveal{opacity:0;transform:translateY(40px);transition:1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.fh{position:fixed;bottom:-40px;pointer-events:none;z-index:40;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes pop{to{opacity:1;transform:none}}
#welcome{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#11664a,var(--deep));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px;text-align:center;transition:opacity 1.4s,transform 1.4s,filter 1.4s}
#welcome.gone{opacity:0;transform:scale(1.5);filter:blur(12px);pointer-events:none}
#welcome h1{font-size:clamp(2rem,9vw,3.6rem)}
.env{width:min(260px,70vw);aspect-ratio:1.5;position:relative;animation:bob 3s ease-in-out infinite}
.env .back{position:absolute;inset:0;background:var(--sage);border-radius:8px;box-shadow:0 0 50px rgba(61,255,160,.45)}
.env .paper{position:absolute;left:8%;right:8%;top:8%;bottom:8%;background:var(--cream);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;transition:transform 1s .5s}
.env .front{position:absolute;inset:0;background:linear-gradient(135deg,#b7c8a4 50%,transparent 50%) left/50% 100% no-repeat,linear-gradient(225deg,#b7c8a4 50%,transparent 50%) right/50% 100% no-repeat;border-radius:8px}
.env .flap{position:absolute;left:0;right:0;top:0;height:55%;background:#86a072;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s}
.env .seal{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:1.8rem;z-index:3;transition:opacity .4s}
.env.open .flap{transform:rotateX(180deg)}.env.open .paper{transform:translateY(-55%)}.env.open .seal{opacity:0}
.btn{font:500 1rem 'Poppins',sans-serif;color:var(--deep);background:linear-gradient(135deg,var(--mint),var(--glow));border:0;border-radius:50px;padding:14px 32px;cursor:pointer;box-shadow:0 0 28px rgba(61,255,160,.6);transition:transform .2s}
.btn:active{transform:scale(.95)}
#hero h1{font-size:clamp(2.4rem,10vw,5.5rem);line-height:1.15}
#hero h1 span{display:inline-block;opacity:0;transform:translateY(30px) scale(.8);animation:pop .8s forwards}
.script,#hero .script{font-family:'Dancing Script',cursive}
#hero .script{font-size:clamp(1.6rem,6vw,2.6rem);color:var(--glow);margin:10px 0 24px}
#hero .wish{max-width:560px;line-height:1.9;font-size:1.05rem}
.scroll{position:absolute;bottom:26px;animation:bob 2s infinite;opacity:.7}
.tl{position:relative;max-width:640px;width:100%;padding-left:34px;text-align:left}
.tl::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:linear-gradient(var(--glow),var(--sage))}
.card{background:rgba(255,255,255,.75);border:2px solid var(--glow);border-radius:18px;padding:20px 22px;margin-bottom:28px;position:relative;box-shadow:0 0 22px rgba(61,255,160,.45);color:var(--ink)}
.card::before{content:'💚';position:absolute;left:-36px;top:18px;font-size:1.1rem}
.card .d{font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:#2f7a5a}
.card h3{margin:4px 0 6px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px;max-width:860px;width:100%}
.pol{background:#fff;padding:10px 10px 14px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;transition:transform .35s;color:var(--ink)}
.pol:nth-child(odd){transform:rotate(-3deg)}.pol:nth-child(even){transform:rotate(3deg)}
.pol:hover{transform:rotate(0) scale(1.06)}
.pol .ph{aspect-ratio:1;background:linear-gradient(135deg,var(--mint),var(--sage));display:flex;align-items:center;justify-content:center;font-size:2.6rem;background-size:cover;background-position:center}
.pol .cap{font-family:'Dancing Script',cursive;font-size:1.25rem;margin-top:8px}
#lb{position:fixed;inset:0;background:rgba(3,20,14,.95);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;gap:14px}
#lb.on{display:flex}#lb img,#lb .big{max-width:94vw;max-height:78vh;border:8px solid #fff;border-radius:4px}
#lb .big{width:70vw;aspect-ratio:1;background:linear-gradient(135deg,var(--mint),var(--sage));display:flex;align-items:center;justify-content:center;font-size:5rem}
#env2{width:min(240px,64vw);aspect-ratio:1.5;background:var(--em);border:2px solid var(--glow);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:3rem;box-shadow:0 0 40px rgba(61,255,160,.5);animation:bob 3s infinite}
#letter{display:none;max-width:620px;width:100%;color:#2b3d33;border-radius:10px;padding:34px 28px;box-shadow:0 0 50px rgba(61,255,160,.4);text-align:left;background:var(--cream) repeating-linear-gradient(transparent 0 33px,#d6e6d0 33px 34px)}
#letter.on{display:block;animation:fade 1s}
@keyframes fade{from{opacity:0;transform:scale(.9)}}
#letter h3{font-family:'Dancing Script',cursive;font-size:2.1rem;color:var(--em);line-height:44px}
#lt{font-family:'Dancing Script',cursive;font-size:1.45rem;line-height:34px;outline:none;white-space:pre-wrap;min-height:200px}
.hint{font-size:.75rem;opacity:.6;margin-top:10px;font-family:'Poppins'}
.rg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:560px;width:100%}
@media(min-width:700px){.rg{grid-template-columns:repeat(5,1fr);max-width:900px}}
.rc{aspect-ratio:1;perspective:600px;cursor:pointer;background:none;border:0;color:inherit;font:inherit;position:relative}
.rc div{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .7s}
.rc .f{background:var(--em);border:2px solid var(--glow);font-size:2rem;box-shadow:0 0 20px rgba(61,255,160,.5)}
.rc .f b{font:500 .8rem 'Poppins'}
.rc .b{background:var(--cream);color:var(--ink);font-size:.82rem;line-height:1.4;transform:rotateY(180deg);border:2px solid var(--sage)}
.rc.flip .f{transform:rotateY(180deg)}.rc.flip .b{transform:none}
.gift{position:relative;width:150px;height:170px;cursor:pointer;margin:30px auto;animation:shake 2.5s infinite}
@keyframes shake{0%,80%,100%{transform:none}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-4deg)}}
.gift .bx,.gift .lid{position:absolute;background:var(--em);border:2px solid var(--glow);box-shadow:0 0 30px rgba(61,255,160,.6)}
.gift .bx{bottom:0;left:6px;right:6px;height:110px;border-radius:6px}
.gift .lid{top:20px;left:-4px;right:-4px;height:48px;border-radius:6px;transition:transform .8s}
.gift .rib{position:absolute;left:50%;width:22px;margin-left:-11px;top:20px;bottom:0;background:var(--glow);opacity:.85;z-index:2}
.gift.open{animation:none}.gift.open .lid{transform:translateY(-90px) rotate(-18deg);opacity:.8}.gift.open .rib{top:68px}
#giftMsg{max-width:520px;font-size:clamp(1.4rem,5vw,2.2rem);opacity:0;transition:opacity 1.5s;line-height:1.5;font-family:'Playfair Display',serif}
#giftMsg.on{opacity:1}
#final{background:radial-gradient(circle at 50% 50%,#0f6b4d,var(--deep) 75%)}
#final h2{font-size:clamp(2.2rem,9vw,4.5rem);margin-bottom:24px}
#final p{max-width:560px;font-size:1.15rem;line-height:1.9;margin-bottom:14px}
#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;gap:8px;align-items:center}
#music button,#music label{background:rgba(6,36,27,.85);border:1.5px solid var(--glow);color:var(--cream);border-radius:50px;padding:10px 14px;font:400 .8rem 'Poppins';cursor:pointer;box-shadow:0 0 14px rgba(61,255,160,.5)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
section{z-index:1}
.dark{background:radial-gradient(ellipse at top,rgba(15,90,67,.75),rgba(6,36,27,.5) 70%)}
#final{background:radial-gradient(circle,rgba(15,107,77,.7),rgba(6,36,27,.5) 75%)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--sage),var(--glow));z-index:95;box-shadow:0 0 10px var(--glow)}
@keyframes tw{to{transform:translateY(-30px) scale(.2);opacity:0}}
@keyframes aur{to{transform:scale(1.25) translate(4%,3%)}}
@keyframes pulse{to{box-shadow:0 0 38px rgba(61,255,160,.85)}}
#hero::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(61,255,160,.25),transparent 50%),radial-gradient(circle at 70% 70%,rgba(156,175,136,.3),transparent 50%);animation:aur 9s ease-in-out infinite alternate}
#hero>*:not(.scroll){position:relative}
.card{animation:pulse 3s ease-in-out infinite alternate}
.cnt{display:flex;gap:10px;margin-bottom:22px}
.cnt div{background:rgba(255,255,255,.08);border:1px solid var(--glow);border-radius:14px;padding:8px 10px;min-width:62px;box-shadow:0 0 16px rgba(61,255,160,.35)}
.cnt b{display:block;font:600 1.5rem 'Playfair Display',serif}
.cnt small{font-size:.62rem;opacity:.7;letter-spacing:1.5px}
.cake{width:170px;margin:30px auto 10px;cursor:pointer;position:relative;padding-top:50px}
.cake i{display:block;height:44px;border:2px solid var(--glow);box-shadow:0 0 20px rgba(61,255,160,.5);border-radius:10px 10px 6px 6px}
.cake i:nth-of-type(1){width:62%;margin:0 auto;background:var(--sage)}
.cake i:nth-of-type(2){background:var(--mint)}
.cake .cd{position:absolute;top:30px;left:50%;margin-left:-3px;width:6px;height:22px;background:var(--cream);border-radius:2px}
.cake .fl{position:absolute;top:4px;left:50%;margin-left:-7px;width:14px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff,var(--glow));box-shadow:0 0 22px var(--glow),0 0 50px var(--glow);animation:flick .3s infinite alternate}
@keyframes flick{to{transform:scale(1.15,.9) rotate(4deg)}}
.cake.out .fl{display:none}
</style></head><body>
<canvas id="stars"></canvas><div id="bar"></div>

<div id="welcome">
  <h1 class="glow" id="wTitle"></h1>
  <div class="env" id="env"><div class="back"></div><div class="paper">💚</div><div class="front"></div><div class="flap"></div><div class="seal">💚</div></div>
  <button class="btn" id="openBtn">Open Your Surprise 💚</button>
</div>
<canvas id="fx"></canvas>
<div id="lb"><div id="lbIn"></div><button class="btn" onclick="this.parentNode.classList.remove('on')">Close 💚</button></div>

<section id="hero" class="dark">
  <h1 class="glow" id="hTitle"></h1>
  <div class="script" id="hSub"></div>
  <div class="cnt" id="cnt"></div>
  <p class="wish reveal" id="hWish"></p>
  <button class="btn" style="margin-top:28px" onclick="celebrate()">More magic ✨💚</button>
  <div class="scroll">scroll down ⌄</div>
</section>

<section class="dark"><h2 class="glow">Make a Wish 💚</h2><p class="sub">Tap the candle to blow it out, Gowsi Papa</p>
  <div class="cake" id="cake"><div class="fl"></div><div class="cd"></div><i></i><i></i></div>
  <p id="wishMsg" class="script" style="font-size:1.8rem;min-height:3rem;color:var(--glow)"></p></section>

<section class="pale"><h2>Our Love Story 💚</h2><p class="sub" id="storySub"></p><div class="tl" id="tl"></div></section>

<section class="dark"><h2 class="glow">Our Memories 💚</h2><p class="sub">Tap any photo, Gowsi Papa</p><div class="gal" id="gal"></div></section>

<section class="pale"><h2>A Secret Love Letter</h2><p class="sub">Tap the envelope, Gowsi Papa 💚</p>
  <div id="env2">💌</div>
  <div id="letter"><h3 id="lh"></h3><div id="lt"></div><div class="hint" id="lhint"></div></div>
</section>

<section class="dark"><h2 class="glow">10 Reasons I Love You 💚</h2><p class="sub">Tap each heart, Gowsi Papa</p><div class="rg" id="rg"></div></section>

<section class="pale"><h2>The Special Gift</h2><p class="sub">Go on… open it 💚</p>
  <div class="gift" id="gift"><div class="bx"></div><div class="lid"></div><div class="rib"></div></div>
  <p id="giftMsg"></p>
</section>

<section id="final"><h2 class="glow" id="f1"></h2><p id="f2"></p><p class="glow" id="f3" style="font-family:'Dancing Script',cursive;font-size:1.9rem"></p></section>

<div id="music">
<input type="file" id="songFile" hidden>  <button id="playBtn">▶ Play 💚</button>
</div>
<audio id="aud" loop></audio>

<script>
/* ========== EDIT EVERYTHING HERE ========== */
const C={
  name:"Gowsi Papa", from:"Your Name",
  wish:"Today the world celebrates the most beautiful soul I know. You make every ordinary day feel magical, and I am the luckiest person alive to be loved by you. May this year hold everything your heart dreams of.",
  storySub:"Every chapter with you is my favourite one",
story:[
{date:"NOV 20 2021",title:"The Day We Met",text:"Random evening on a School day, i didn't expect that we met that day.That blush in my face and i still remembers it"},
{date:"NOV 26 2023",title:"Our First Conversation",text:"We started with simple words, and somehow the hours disappeared. That was the day I realised talking to you felt like home."},
{date:"NOV 26 2023",title:"Marriage day",text:"That day wasn't just the day we got married . It was the day our forever story began"},
{date:"AUG 16 2025",title:"A Special Moment",text:"A meet with your mother.\n  The moment I knew for sure: you were not just a part of my life, you were my forever."}
],
  /* photos: put image links or file names, e.g. {src:"photos/us1.jpg",cap:"Our first trip"} — leave src empty for a placeholder */
photos:[{src:"pic5.jpg",cap:"Our first day"},{src:"pic3.jpg",cap:"Us, always"},{src:"pic6.jpg",cap:"My favourite smile"},{src:"pic1.jpg",cap:"Sweet memories"},{src:"pic2.jpg",cap:"Kovakari"},{src:"pic4.jpg",cap:"Gundu Papa"}],  letter:"My dearest Gowsi Papa,\n\nFrom the moment you came into my life, everything became softer, brighter and more beautiful. You are my calm, my joy and my favourite person.\n\nOn your birthday I want you to know that I am endlessly grateful for you. Thank you for loving me exactly as I am.\n\nForever yours 💚",
  reasons:["Your smile lights up my whole world","You make me a better person","Your heart is the kindest I know","You laugh and my day is perfect","You understand me without words","You are my peace after a long day","You believe in me, always","Every moment with you is magic","You are beautifully, wonderfully you","Because you are my Gowsi Papa 💚"],
  gift:"You are my favourite person, Gowsi Papa. Forever and always 💚",
  final:["Happy Birthday, My Gowsi Papa 💚","No matter how many birthdays come and go, I will always choose you.","Forever yours, with all my love 💚"],
  since:"2026-11-28T00:00:00", /* the date your story began (live counter on the first page) */
  song:"song.mp3.mp3" /* optional: "music/song.mp3" — or use the Upload button */
};
/* ========================================== */
const $=id=>document.getElementById(id);
const G=['#3dffa0','#c8f0d8','#9caf88','#fbf6e9','#1fd17f','#7dffc0'];
$('wTitle').textContent=`Hey ${C.name} 💚`;
$('hSub').textContent='counting down your special day 💚';
$('hWish').textContent=C.wish;$('storySub').textContent=C.storySub;
$('hTitle').innerHTML=`Happy Birthday,<br>`+`${C.name}! 💚`.split(' ').map((w,i)=>`<span style="animation-delay:${.3+i*.25}s">${w}</span>`).join(' ');
$('tl').innerHTML=C.story.map(s=>`<div class="card reveal"><div class="d">${s.date}</div><h3>${s.title}</h3><p>${s.text}</p></div>`).join('');
$('gal').innerHTML=C.photos.map((p,i)=>`<div class="pol reveal" data-i="${i}"><div class="ph" style="${p.src?`background-image:url('${p.src}')`:''}">${p.src?'':'💚'}</div><div class="cap">${p.cap}</div></div>`).join('');
$('gal').onclick=e=>{const p=e.target.closest('.pol');if(!p)return;const d=C.photos[p.dataset.i];
  $('lbIn').innerHTML=d.src?`<img src="${d.src}" alt="${d.cap}">`:`<div class="big">💚</div>`;$('lb').classList.add('on')};
$('lh').textContent=`To My ${C.name} 💚`;
$('rg').innerHTML=C.reasons.map((r,i)=>`<button class="rc reveal"><div class="f">💚<b>${i+1}</b></div><div class="b">${r}</div></button>`).join('');
$('rg').onclick=e=>{const c=e.target.closest('.rc');if(!c)return;c.classList.toggle('flip');if(c.classList.contains('flip')){const r=c.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,20)}};
$('f1').textContent=C.final[0];$('f2').textContent=C.final[1];$('f3').textContent=C.final[2];

/* effects */
const cv=$('fx'),cx=cv.getContext('2d');let P=[],run=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
size();addEventListener('resize',size);
function burst(x,y,n=60){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=2+Math.random()*5;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:G[i%G.length],r:2+Math.random()*2,g:.05})}go()}
function confetti(){for(let i=0;i<90;i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,l:1.6,c:G[i%G.length],r:3+Math.random()*3,g:0,sq:1});go()}
function go(){if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.l>0);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.l-=p.sq?.005:.014;cx.globalAlpha=Math.max(0,Math.min(1,p.l));cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=8;
    p.sq?cx.fillRect(p.x,p.y,p.r*1.6,p.r):(cx.beginPath(),cx.arc(p.x,p.y,p.r,0,6.283),cx.fill())}
  cx.globalAlpha=1;P.length?requestAnimationFrame(tick):(run=false,cx.clearRect(0,0,innerWidth,innerHeight))}
function fireworks(n=5){for(let i=0;i<n;i++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.4),70),i*400)}
function celebrate(){fireworks(4);confetti()}
function heart(){const h=document.createElement('div');h.className='fh';h.textContent=Math.random()<.2?'✨':'💚';h.style.left=Math.random()*100+'vw';h.style.fontSize=14+Math.random()*26+'px';h.style.animationDuration=6+Math.random()*6+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),12500)}
let hi=setInterval(heart,700);

/* welcome */
$('openBtn').onclick=()=>{$('env').classList.add('open');$('openBtn').style.display='none';
  setTimeout(()=>{$('welcome').classList.add('gone');celebrate()},1300);setTimeout(()=>$('welcome').remove(),2800)};

/* scroll reveal + final fireworks */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.2});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
let fw;new IntersectionObserver(es=>es.forEach(e=>{clearInterval(fw);if(e.isIntersecting){fireworks(3);fw=setInterval(()=>fireworks(3),3500)}}),{threshold:.5}).observe($('final'));

/* letter */
let typed=false;
$('env2').onclick=()=>{$('env2').style.display='none';$('letter').classList.add('on');if(typed)return;typed=true;
  const t=$('lt');let i=0;(function k(){if(i<C.letter.length){t.textContent+=C.letter[i++];setTimeout(k,35)}else{}})()};

/* gift */
$('gift').onclick=()=>{const g=$('gift');if(g.classList.contains('open'))return;g.classList.add('open');
  const r=g.getBoundingClientRect();burst(r.left+75,r.top+40,90);setTimeout(()=>burst(r.left+75,r.top,60),300);
  $('giftMsg').textContent=C.gift;setTimeout(()=>$('giftMsg').classList.add('on'),600)};

/* music — starts only on click */
const a=$('aud');if(C.song)a.src=C.song;
$('songFile').onchange=e=>{const f=e.target.files[0];if(f){a.src=URL.createObjectURL(f);a.play();$('playBtn').textContent='⏸ Pause 💚'}};
$('playBtn').onclick=()=>{if(!a.src){return}  if(a.paused){a.play();$('playBtn').textContent='⏸ Pause 💚'}else{a.pause();$('playBtn').textContent='▶ Play 💚'}};
/* ===== extra magic ===== */
function heartBurst(x,y){for(let i=0;i<70;i++){const t=i/70*6.283,k=.2;P.push({x,y,vx:16*Math.sin(t)**3*k,vy:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*k,l:1.3,c:G[i%G.length],r:2.6,g:.02})}go()}
function fireworks(n=5){for(let i=0;i<n;i++)setTimeout(()=>{const x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.18+Math.random()*.35);i%2?heartBurst(x,y):burst(x,y,70)},i*400)}
function heart(){const h=document.createElement('div'),E=['💚','💚','💚','✨','🌿','🍃','🌸'];h.className='fh';h.textContent=E[Math.floor(Math.random()*E.length)];h.style.left=Math.random()*100+'vw';h.style.fontSize=14+Math.random()*26+'px';h.style.animationDuration=6+Math.random()*6+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),12500)}
const sc=$('stars'),sx=sc.getContext('2d');let S=[];
function sz(){sc.width=innerWidth;sc.height=innerHeight;S=Array.from({length:70},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.6+.3,p:Math.random()*6.28,s:.01+Math.random()*.03}))}
sz();addEventListener('resize',sz);
(function st(){sx.clearRect(0,0,sc.width,sc.height);for(const s of S){s.p+=s.s;sx.globalAlpha=.3+.7*Math.abs(Math.sin(s.p));sx.fillStyle='#c8f0d8';sx.shadowColor='#3dffa0';sx.shadowBlur=6;sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.283);sx.fill()}requestAnimationFrame(st)})();
function sp(e){const t=e.touches?e.touches[0]:e;if(!t||Math.random()<.5)return;const d=document.createElement('div');d.className='fh';d.style.cssText=`left:${t.clientX}px;top:${t.clientY}px;bottom:auto;font-size:12px;animation:tw .9s forwards`;d.textContent='💚';document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
addEventListener('pointermove',sp);addEventListener('touchmove',sp,{passive:true});
addEventListener('scroll',()=>{$('bar').style.width=scrollY/(document.documentElement.scrollHeight-innerHeight)*100+'%'});
(function(){const t=new Date(C.since).getTime();function u(){const d=Math.max(0,t-Date.now());$('cnt').innerHTML=[[Math.floor(d/864e5),'DAYS'],[Math.floor(d/36e5)%24,'HOURS'],[Math.floor(d/6e4)%60,'MINS'],[Math.floor(d/1e3)%60,'SECS']].map(x=>`<div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}u();setInterval(u,1000)})();
$('cake').onclick=()=>{const c=$('cake');if(c.classList.contains('out'))return;c.classList.add('out');const r=c.getBoundingClientRect();heartBurst(r.left+85,r.top);confetti();$('wishMsg').textContent=`Make your wish, ${C.name}… I hope I’m in it 💚`};
</script></body></html>
